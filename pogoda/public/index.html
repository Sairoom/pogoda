<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17110d" />
    <meta
      name="description"
      content="Кофейня «Погода» на Святоозёрской, 16 в Москве. Авторский кофе, сезонное меню, десерты и уютный зал с гирляндами. Не надо париться — кофе варится."
    />
    <meta property="og:title" content="Погода — кофейня на Святоозёрской, 16" />
    <meta
      property="og:description"
      content="Авторский кофе, сезонное меню и уютный зал в Москве. Мы работаем — вы кайфуете."
    />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Погода — кофейня на Святоозёрской, 16</title>
    <!--
      Разметка для поисковиков. Страница рисуется на клиенте, поэтому
      данные о заведении отдаём статикой — краулеру не нужно ждать JS.
      График работы намеренно не указан: сверьте и добавьте openingHours.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CafeOrCoffeeShop",
        "name": "Погода",
        "description": "Кофейня с авторским кофе, сезонным меню и десертами.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Святоозёрская ул., 16",
          "addressLocality": "Москва",
          "addressCountry": "RU"
        },
        "telephone": "+7 916 675-65-48",
        "servesCuisine": "Кофе",
        "priceRange": "₽"
      }
    </script>
  </head>
  <body>
    <noscript>Для работы сайта нужно включить JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
